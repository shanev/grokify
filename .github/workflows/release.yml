name: Release

# Triggered by pushing a version tag (done by `pnpm release` in extension/).
# Tests, packages, creates a GitHub Release, then submits to the Chrome Web Store.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
    defaults:
      run:
        working-directory: extension
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches package.json version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm build
          (cd build/chrome-mv3-prod && zip -qr ../../grokify-extension.zip .)
          manifest_version="$(unzip -p grokify-extension.zip manifest.json | node -pe "JSON.parse(require('fs').readFileSync(0)).version")"
          if [[ "$manifest_version" != "$VERSION" ]]; then
            echo "::error::Built manifest version $manifest_version does not match package.json"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: grokify-extension
          path: extension/grokify-extension.zip
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" grokify-extension.zip --clobber
          else
            gh release create "$TAG" grokify-extension.zip --title "$TAG" --generate-notes --verify-tag
          fi

  publish-chrome:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the Web Store config; add required reviewers in repo settings to
    # gate store submissions behind a manual approval.
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write # keyless auth to Google Cloud via Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - name: Check Web Store configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          missing=()
          [[ -n "$WIF_PROVIDER" ]] || missing+=(GCP_WORKLOAD_IDENTITY_PROVIDER)
          [[ -n "$SERVICE_ACCOUNT" ]] || missing+=(GCP_SERVICE_ACCOUNT)
          [[ -n "$PUBLISHER_ID" ]] || missing+=(CWS_PUBLISHER_ID)
          [[ -n "$EXTENSION_ID" ]] || missing+=(CWS_EXTENSION_ID)
          if (( ${#missing[@]} )); then
            echo "::error::Missing variables in the chrome-web-store environment: ${missing[*]}. See extension/RELEASING.md, then re-run this job."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: grokify-extension

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s

      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          VERSION: ${{ needs.package.outputs.version }}
        run: extension/scripts/publish-cws.sh grokify-extension.zip "$VERSION"
